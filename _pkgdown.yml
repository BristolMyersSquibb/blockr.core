url: https://bristolmyerssquibb.github.io/blockr.core/
template:
  bootstrap: 5
  light-switch: true
  includes:
    in_header: >
      <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.5.0/mermaid.min.js" integrity="sha512-3EZqKCkk3nMLmbrI7mfry81KH7dkzy/BoDfQrodwLQnS/RbsVlERdYP6J0oiJegRUxSOmx7Y35WNbVKSw7mipw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

navbar:
 components:
   articles:
    text: Articles
    menu:
    - text: Get started
      href: articles/get-started.html
    - text: Create a block class
      href: articles/create-block.html
    - text: Block expressions
      href: articles/block-expressions.html

reference:
- title: Board objects
- subtitle: Blocks
  desc: Data analysis pipelines are decomposed into steps, each represented by a block.
  contents:
    - new_block_class
    - interpolate
    - bbquote
    - evaluate_block
    - new_block_request
    - expect_block_fixture
    - trace_block_classes
    - block_name
    - register_block
    - block_registration_roclet
    - new_arg_spec
- subtitle: Outputs
  desc: What R shows of a block's result, which a renderer draws in the client.
  contents:
    - new_block_output
    - output_schema
    - new_table_output
    - new_text_output
    - new_plot_output
- subtitle: Links
  desc: Utilities for creating an working with links
  contents:
    - new_link
- subtitle: Stacks
  desc: Utilities for creating an working with stacks
  contents:
    - new_stack
- subtitle: Board
  desc: Utilities for creating an working with boards
  contents:
    - new_board
    - board_blocks
    - new_board_options
    - board_option_version
    - locked-board
- subtitle: Plugins and modules
  desc: What a package declares in R of its client
  contents:
    - new_plugin
    - new_renderer
    - read_blocks_yml
    - install_js_types
    - request-types
    - report_progress
- title: Block classes
  desc: Core's built-in blocks, each a block class with its constructor.
  contents:
    - new_dataset_block
    - new_static_block
    - new_filebrowser_block
    - new_upload_block
    - new_csv_block
    - new_head_block
    - new_merge_block
    - new_rbind_block
    - new_subset_block
    - new_fixed_block
    - new_scatter_block
    - new_glue_block
- title: Utilities
- subtitle: Serialization
  desc: Serialization and deserialization utilities.
  contents:
  - blockr_ser
- subtitle: Logging
  desc: Tools for logging.
  contents:
  - write_log
- subtitle: Miscellaneous
  desc: Various tools and utilities.
  contents:
  - topo_sort
  - rand_names
  - blockr_option
  - serve
  - export_code
  - str_value
  - chr_ply
  - set_names
  - is_scalar
  - get_session
  - blockr_abort
