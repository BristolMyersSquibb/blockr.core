on:
  pull_request:
    branches: [main, js-state]
  merge_group:

name: ci

jobs:
  ci:
    uses: BristolMyersSquibb/blockr.ci/.github/workflows/ci.yaml@main
    with:
      typescript-dir: '.'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}

  # Lists no downstream until one has a js-state branch of its own. The job
  # stays for revdep / revdep-all, a required check, which passes with none.
  revdep:
    uses: BristolMyersSquibb/blockr.ci/.github/workflows/revdep.yaml@main
    secrets:
      BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}
